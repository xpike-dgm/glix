<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer metallic bezel -->
  <circle cx="32" cy="32" r="30" fill="#0C101D" stroke="#334155" stroke-width="2"/>
  <!-- Emissive track background -->
  <circle cx="32" cy="32" r="26" stroke="#1E293B" stroke-width="3"/>
  <!-- Active neon progress indicator -->
  <circle cx="32" cy="32" r="26" stroke="#00F5FF" stroke-width="3" stroke-dasharray="140 24" stroke-linecap="round"/>
  <!-- Tick marks at 12, 3, 6, 9 o'clock -->
  <line x1="32" y1="7" x2="32" y2="10" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="57" y1="32" x2="54" y2="32" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="32" y1="57" x2="32" y2="54" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="7" y1="32" x2="10" y2="32" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Inner smoked glass fill -->
  <circle cx="32" cy="32" r="22" fill="#121829" opacity="0.8"/>
</svg>