# This file is mounted into the Glix client container.
# Replace the placeholder server_name when Glix receives its real hostname.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream glix_backend {
    server glix-server:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name glix.example.invalid;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    sendfile on;
    client_max_body_size 1m;

    # The server already exposes a JSON health endpoint. Keeping this on the
    # same origin makes container and reverse-proxy checks straightforward.
    location = /health {
        proxy_pass http://glix_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_buffering off;
    }

    # WebSocket upgrade for the real-time game server. The client uses /ws so
    # gameplay and the PWA stay on one browser origin.
    location = /ws {
        proxy_pass http://glix_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # A service worker must be revalidated so a new release can take over.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Vite's fingerprinted assets can be cached for a long time. Missing
    # assets should remain 404s instead of being served as index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # React/Vite SPA fallback for every client-side route.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
