name: ${GLIX_COMPOSE_PROJECT_NAME:-glix-party}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  glix-server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    image: ${GLIX_SERVER_IMAGE:-glix-party-server:local}
    environment:
      NODE_ENV: production
      HOST: ${GLIX_SERVER_HOST:-0.0.0.0}
      PORT: ${GLIX_SERVER_PORT:-8787}
    expose:
      - "8787"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging: *default-logging
    networks:
      - glix-internal

  glix-client:
    build:
      context: ..
      dockerfile: deploy/client.Dockerfile
    image: ${GLIX_CLIENT_IMAGE:-glix-party-client:local}
    depends_on:
      glix-server:
        condition: service_healthy
    ports:
      - "${GLIX_BIND_ADDRESS:-127.0.0.1}:${GLIX_HTTP_PORT:-18080}:80"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - glix-nginx-cache:/var/cache/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging: *default-logging
    networks:
      - glix-edge
      - glix-internal

networks:
  # Only the client/reverse-proxy edge joins this normal bridge and publishes
  # the loopback port above. The game server remains off the host network.
  glix-edge:
    name: ${GLIX_COMPOSE_PROJECT_NAME:-glix-party}-edge
    driver: bridge

  # The game server and the client proxy share this private network. It has no
  # external route; the client can still reach the server by service name.
  glix-internal:
    name: ${GLIX_COMPOSE_PROJECT_NAME:-glix-party}-internal
    driver: bridge
    internal: true

volumes:
  # Glix game rooms are intentionally in memory; this volume is only for
  # Nginx's operational cache and can be removed without losing match data.
  glix-nginx-cache:
    name: ${GLIX_COMPOSE_PROJECT_NAME:-glix-party}-nginx-cache
