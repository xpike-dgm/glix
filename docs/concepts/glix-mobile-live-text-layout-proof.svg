<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780" role="img" aria-labelledby="title desc">
  <title id="title">GLIX Premium 2D Arcade live text and safe-area layout proof</title>
  <desc id="desc">Non-runtime SVG wireframe showing a 320 by 700 portrait home layout and a canonical 667 by 375 landscape private cable-panel layout. All labels are live SVG text and control boxes show the minimum touch target.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#0E1226"/>
    </linearGradient>
    <linearGradient id="cyanFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72F4FF"/>
      <stop offset="1" stop-color="#1B4A76"/>
    </linearGradient>
    <linearGradient id="magentaFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF55D8"/>
      <stop offset="1" stop-color="#4C1E62"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font-family: Arial, sans-serif; fill: #F5F7FF; font-weight: 700; letter-spacing: .08em; }
      .meta { font-family: Arial, sans-serif; fill: #B8C1D9; font-size: 12px; letter-spacing: .05em; }
      .live { font-family: Arial, sans-serif; fill: #F5F7FF; font-size: 14px; font-weight: 700; letter-spacing: .12em; }
      .safe { fill: none; stroke: #B8C1D9; stroke-opacity: .42; stroke-dasharray: 5 5; }
      .hit { fill: #72F4FF; fill-opacity: .08; stroke: #72F4FF; stroke-width: 2; }
      .secondary { fill: #0E1226; stroke: #FF55D8; stroke-width: 2; }
      .primary { fill: #123B50; stroke: #72F4FF; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1320" height="780" fill="#02030A"/>
  <text x="40" y="28" class="label" font-size="16">GLIX · 2D LIVE-TEXT / SAFE-AREA PROOF</text>
  <text x="40" y="52" class="meta">NON-RUNTIME SVG WIREFRAME · ALL LABELS BELOW ARE LIVE SVG TEXT</text>

  <!-- 320x700 portrait proof -->
  <g transform="translate(30,65)">
    <rect width="320" height="700" rx="28" fill="url(#night)" stroke="#2B3540" stroke-width="4"/>
    <rect x="14" y="14" width="292" height="672" rx="20" class="safe"/>
    <text x="160" y="43" text-anchor="middle" class="meta">320×700 PORTRAIT</text>
    <text x="160" y="86" text-anchor="middle" class="label" font-size="28">GLIX</text>
    <text x="160" y="111" text-anchor="middle" class="meta">AYNI ODA · FARKLI HAMLE</text>
    <text x="160" y="135" text-anchor="middle" class="meta">LIVE SVG LOGO + PREMISE</text>

    <rect x="46" y="166" width="228" height="274" rx="18" fill="#0B1024" stroke="#2B3540" stroke-width="3"/>
    <path d="M160 198 L220 258 L160 318 L100 258 Z" fill="url(#cyanFacet)" stroke="#F5F7FF" stroke-width="3" filter="url(#softGlow)"/>
    <path d="M160 318 L208 366 L160 414 L112 366 Z" fill="url(#magentaFacet)" stroke="#F5F7FF" stroke-width="2"/>
    <circle cx="160" cy="258" r="84" fill="none" stroke="#7B61FF" stroke-opacity=".72" stroke-width="3"/>
    <rect x="116" y="420" width="88" height="8" rx="4" fill="#FFC857"/>
    <text x="160" y="462" text-anchor="middle" class="meta">PLANAR HERO OBJECT · DECORATIVE LAYER BEHIND CTA</text>

    <rect x="46" y="486" width="228" height="52" rx="10" class="hit primary"/>
    <text x="160" y="519" text-anchor="middle" class="live">ODA KUR</text>
    <text x="286" y="518" text-anchor="end" class="meta">≥44px</text>
    <rect x="46" y="548" width="228" height="52" rx="10" class="hit secondary"/>
    <text x="160" y="581" text-anchor="middle" class="live">KATIL</text>
    <text x="286" y="580" text-anchor="end" class="meta">≥44px</text>
    <rect x="70" y="622" width="180" height="44" rx="8" fill="none" stroke="#9A7BFF" stroke-width="2"/>
    <text x="160" y="650" text-anchor="middle" class="live" font-size="12">NASIL OYNANIR</text>
    <text x="160" y="683" text-anchor="middle" class="meta">LIVE LABEL · NO SCROLL</text>
  </g>

  <!-- 844x390 landscape proof -->
  <g transform="translate(405,190) scale(.79028,.96154)">
    <rect width="844" height="390" rx="26" fill="url(#night)" stroke="#2B3540" stroke-width="4"/>
    <rect x="16" y="16" width="812" height="358" rx="18" class="safe"/>
    <text x="28" y="42" class="meta">667×375 LANDSCAPE · PRIVATE GAMEPLAY</text>
    <text x="816" y="42" text-anchor="end" class="live" font-size="12">PHASE · LIVE TIMER</text>
    <rect x="40" y="62" width="764" height="52" rx="10" fill="#0E1226" stroke="#2B3540" stroke-width="2"/>
    <text x="62" y="94" class="live" font-size="13">KONTROL PANELİ KAOSU</text>
    <text x="782" y="94" text-anchor="end" class="meta">PRIVATE CLUE · LIVE HTML/SVG</text>

    <rect x="40" y="136" width="764" height="174" rx="16" fill="#0B1024" stroke="#2B3540" stroke-width="3"/>
    <rect x="52" y="153" width="740" height="46" rx="8" class="hit"/>
    <rect x="52" y="193" width="740" height="46" rx="8" class="hit"/>
    <rect x="52" y="233" width="740" height="46" rx="8" class="hit"/>
    <rect x="52" y="273" width="740" height="46" rx="8" class="hit"/>
    <path d="M80 176 C178 176 224 176 300 176 S420 176 492 176 S620 176 764 176" fill="none" stroke="#72F4FF" stroke-width="12" stroke-linecap="round"/>
    <path d="M80 216 C178 216 224 216 300 216 S420 216 492 216 S620 216 764 216" fill="none" stroke="#FF55D8" stroke-width="12" stroke-linecap="round"/>
    <path d="M80 256 C178 256 224 256 300 256 S420 256 492 256 S620 256 764 256" fill="none" stroke="#A8F46A" stroke-width="12" stroke-linecap="round"/>
    <path d="M80 296 C178 296 224 296 300 296 S420 296 492 296 S620 296 764 296" fill="none" stroke="#FFC857" stroke-width="12" stroke-linecap="round"/>
    <rect x="316" y="152" width="212" height="34" rx="8" class="hit"/>
    <text x="422" y="174" text-anchor="middle" class="meta">OWN CLUE · PRIVATE</text>
    <rect x="56" y="326" width="176" height="44" rx="8" class="hit primary"/>
    <text x="144" y="354" text-anchor="middle" class="live" font-size="12">KABLOYU KES</text>
    <text x="800" y="354" text-anchor="end" class="meta">4 TOUCH LANES · ≥44px</text>
  </g>

  <g transform="translate(405,620)">
    <rect width="844" height="64" rx="12" fill="#0E1226" stroke="#2B3540"/>
    <circle cx="24" cy="32" r="7" fill="#72F4FF"/>
    <text x="42" y="37" class="meta">CYAN = FOCUS / HERO · MAGENTA = SECONDARY · GRAY DASH = SAFE/LIVE TEXT · COLOR NEVER ENCODES PRIVATE STATE</text>
  </g>
</svg>
